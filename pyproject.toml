[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-agent"
version = "0.1.0"
description = "Trustworthy Analytics Agent: multi-agent RAG text-to-SQL with guardrails, evaluation and an LLM gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "faker>=25.0",
  "structlog>=24.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "sqlglot>=25.0",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "litellm>=1.40",
]
ui = ["streamlit>=1.36", "pandas>=2.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "pre-commit>=3.7", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "week1: foundations and data checks",
  "week2: gateway and retrieval checks",
  "week3: core agent checks",
  "week4: deep agent and HITL checks",
  "week5: guardrails and evaluation checks",
  "integration: needs the docker-compose Postgres",
]
